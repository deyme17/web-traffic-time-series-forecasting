# interval
lookback: 365
horizon: 62

# dataloader
train_batch: 128
valid_batch: 256
test_batch: 256
n_workers: 4

# training
seed: 177
epochs: 100
max_norm: 2
patience: 10

# registries
model: 
    name: "LSTM"
    parameters:
        enc_h_size: 256
        dec_h_size: 256
        n_layers: 1
        dropout: 0.2
        dropout_ctx: 0.
        attn_type: "additive"
        attn_size: 128


loss: 
    name: "MAE"
    parameters: {}


optimizer: 
    name: "AdamW"
    parameters:
        lr:  0.0004
        betas: [0.9, 0.999]
        weight_decay: 0.0004
        amsgrad: False


scheduler: 
    name: "ReduceLROnPlateau"
    parameters:
        mode: 'min'
        factor: 0.5
        patience: 7
        min_lr: 0.00001