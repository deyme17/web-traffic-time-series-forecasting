# interval
lookback: 365
horizon: 62

# dataloader
train_batch: 128
valid_batch: 256
test_batch: 256
n_workers: 4

# training
seed: 17
steps: 1000
warmup_steps: 300
update_steps: 100
max_norm: 2

# registries
model: 
    name: "LSTM"
    parameters:
        enc_h_size: 256
        dec_h_size: 256
        n_layers: 1
        attn_type: "multihead"
        attn_size: 128
        attn_n_heads: 4
        dropout_enc: 0.2
        dropout_dec: 0.0
        dropout_ctx: 0.5
        dropout_h: 0.005
        dropout_c: 0.005
        dropout_out: 0.3


loss: 
    name: "MAE"
    parameters: {}


optimizer: 
    name: "AdamW"
    parameters:
        lr:  0.0005
        betas: [0.9, 0.999]
        weight_decay: 0.0001
        amsgrad: False


scheduler: 
    name: "CosineAnnealingLR"
    parameters:
        T_max: 1000
        eta_min: 0.0001